info:
  name: Get Project Notes
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/api/v1/projects/{{PROJECT_ID}}/notes"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## Get Project Notes

  Returns all notes belonging to the specified project.

  ### Path Parameters

  - `projectId`: Required valid MongoDB ObjectId identifying the project.

  ### Authentication

  Required. The request uses the authenticated user's inherited authorization configuration.

  ### Authorization

  System administrators and members of the specified project can view its notes.

  ### Request Body

  No request body is required.
