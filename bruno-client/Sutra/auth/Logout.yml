  name: Logout
  type: http
  seq: 5

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/auth/logout"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## Logout User

  Logs out the currently authenticated user by invalidating the stored refresh token and clearing the authentication cookies.

  ### Authentication

  Required. The request uses the authenticated user's inherited authorization configuration.

  ### Request Body

  No request body is required.

  ### Notes

  A successful request clears the `access-token` and `refresh-token` cookies and invalidates the user's stored refresh token.
