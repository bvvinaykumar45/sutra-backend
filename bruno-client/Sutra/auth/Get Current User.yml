http:
  method: GET
  url: "{{BASE_URL}}/api/v1/auth/current-user"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## Get Current User

  Returns the profile details of the currently authenticated user.

  ### Authentication

  Required. The request uses the authenticated user's inherited authorization configuration.

  ### Request Body

  No request body is required.
