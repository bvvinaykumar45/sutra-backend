info:
  name: Forgot Password
  type: http
  seq: 7

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/auth/forgot-password"
  body:
    type: json
    data: |-
      {
        "email": "{{USER_EMAIL}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## Forgot Password

  Requests a password-reset email for a registered user.

  ### Request Body

  - `email`: Required string containing a valid registered email address.

  ### Authentication

  Not required.

  ### Notes

  If the request is accepted, a temporary password-reset token is generated and a reset link is sent to the user's email address.
