info:
  name: Change Password
  type: http
  seq: 9

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/auth/change-password"
  body:
    type: json
    data: |-
      {
        "oldPassword": "{{CURRENT_PASSWORD}}",
        "newPassword": "{{NEW_PASSWORD}}",
        "confirmPassword": "{{CONFIRM_PASSWORD}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## Change Password

  Changes the password of the currently authenticated user.

  ### Request Body

  - `oldPassword`: Required string containing the user's current password.
  - `newPassword`: Required string of at least 8 characters. Must contain at least one lowercase letter, one uppercase letter, one number, and one symbol. It must be different from `oldPassword`.
  - `confirmPassword`: Required string. Must exactly match `newPassword`.

  ### Authentication

  Required. The request uses the authenticated user's inherited authorization configuration.

  ### Notes

  After a successful password change, update the password variables in the selected local Bruno environment before making subsequent login requests.
