info:
  name: Reset Forgot Password
  type: http
  seq: 8

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/auth/reset-password/{{RESET_TOKEN}}"
  body:
    type: json
    data: |-
      {
        "password": "{{NEW_PASSWORD}}",
        "confirmPassword": "{{CONFIRM_PASSWORD}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## Reset Forgotten Password

  Resets a user's password using the temporary reset token sent to their registered email address.

  ### Path Parameters

  - `resetToken`: Required hexadecimal string containing the temporary password-reset token.

  ### Request Body

  - `password`: Required string of at least 8 characters. Must contain at least one lowercase letter, one uppercase letter, one number, and one symbol.
  - `confirmPassword`: Required string. Must exactly match `password`.

  ### Authentication

  Not required.

  ### Notes

  The reset token is temporary and must still be valid when the request is submitted.
