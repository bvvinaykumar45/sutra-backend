info:
  name: Create Project
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/api/v1/projects"
  body:
    type: json
    data: |-
      {
        "title": "{{PROJECT_TITLE}}",
        "description": "{{PROJECT_DESCRIPTION}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ## Create Project

  Creates a new project and adds the authenticated user as a project administrator.

  ### Request Body

  - `title`: Required non-empty string containing the project title.
  - `description`: Optional string containing the project description.

  ### Authentication

  Required. The request uses the authenticated user's inherited authorization configuration.

  ### Authorization

  Only a system administrator can create a project.
